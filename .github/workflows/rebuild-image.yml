name: Rebuild WARHOST image

on:
  schedule:
    # Daily check. A successful Eugen image publish changes the digest and triggers a rebuild.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when Eugen's image digest is unchanged
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint-unraid.sh
      - .github/workflows/rebuild-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: rebuild-warhost-image
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test settings entrypoint
        run: sh tests/entrypoint_test.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Eugen image digest
        id: upstream
        run: |
          digest="$(python3 scripts/upstream_digest.py)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: plan
        env:
          IMAGE: ghcr.io/suchamoneypit/warhost:latest
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force }}
          UPSTREAM: ${{ steps.upstream.outputs.digest }}
        run: |
          set -eu
          force=false
          if [ "$EVENT_NAME" = "push" ] || [ "${INPUT_FORCE:-}" = "true" ]; then
            force=true
          fi
          current=""
          if [ "$force" = "false" ] && docker pull "$IMAGE"; then
            current="$(docker image inspect --format '{{ index .Config.Labels "warno.upstream.digest" }}' "$IMAGE")"
          fi
          if [ "$force" = "false" ] && [ "$current" = "$UPSTREAM" ]; then
            echo "Eugen image digest is unchanged. Skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Build required. Upstream digest ${UPSTREAM}."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/suchamoneypit/warhost:latest
            ghcr.io/suchamoneypit/warno-unraid:latest
          build-args: |
            UPSTREAM_DIGEST=${{ steps.upstream.outputs.digest }}

      - name: Make GHCR package public
        if: steps.plan.outputs.build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT /user/packages/container/warhost/visibility -f visibility=public
          gh api --method PUT /user/packages/container/warno-unraid/visibility -f visibility=public

name: Tag WARHOST release

on:
  push:
    branches:
      - main
    # A README or docs save does not start this job. scripts/ and .github/
    # still do: release_scope.py diffs from the latest tag, so a notes-only
    # commit can finish a product change that has not been tagged yet.
    paths-ignore:
      - README.md
      - docs/**
      - CLAUDE.md
      - .cursor/**
      - .claude/**
      - ca_profile.xml
      - icon.png
      - samples/**
      - tests/**
      - webui/test_page.sh
      - webui/make_catalog.py
      - webui/previews/**
      - webui/run/**

permissions:
  contents: write

concurrency:
  group: tag-warhost-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to release
        id: scope
        run: |
          set -eu
          scope="$(python3 scripts/release_scope.py)"
          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
          if [ "$scope" = "skip" ]; then
            echo "No release. This push does not change the server, the Unraid template, the WebUI, or the image."
          elif [ "$scope" != "release" ]; then
            echo "release_scope.py printed ${scope}" >&2
            exit 1
          fi

      - name: Decide version
        if: steps.scope.outputs.scope == 'release'
        id: version
        run: |
          set -eu
          points="$(git tag --points-at "$GITHUB_SHA")"
          if [ -n "$points" ]; then
            # Tags are one per line. Word splitting is the argument list.
            # shellcheck disable=SC2086
            version="$(python3 scripts/next_version.py --points-at $points)"
          else
            version="$(python3 scripts/next_version.py)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Tag and publish GitHub Release
        if: steps.scope.outputs.scope == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          notes="${RUNNER_TEMP:-/tmp}/warhost-release-notes.txt"
          err="${RUNNER_TEMP:-/tmp}/warhost-release-notes.err"
          if ! python3 scripts/release_notes.py --tag "${TAG}" --to "${GITHUB_SHA}" >"${notes}" 2>"${err}"; then
            detail=$(cat "${err}")
            echo "::error title=Missing release summary::${detail}"
            echo "${detail}" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            existing="$(git rev-parse "${TAG}^{}")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag ${TAG} already points at ${existing}." >&2
              exit 1
            fi
            echo "Tag ${TAG} already points at this commit."
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "${TAG}" -m "WARHOST ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file "${notes}" --target "${GITHUB_SHA}"
          fi
